name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Prevent overlapping deploys from racing on the gh-pages branch.
# cancel-in-progress: false → if a run is mid-deploy, queue the next one
# instead of killing it (avoids leaving gh-pages half-pushed).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          cd webapp/client
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: webapp/client/dist
          branch: gh-pages
          # Rewrite gh-pages with a single commit each run — avoids
          # accumulated history conflicting with GitHub's auto-build
          # workflow that follows every gh-pages push.
          single-commit: true
          force: true
